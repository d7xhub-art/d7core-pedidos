<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Recuperar D7COMERCIAL</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;font-family:Segoe UI,Arial,sans-serif;color:#1f2937}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px;text-align:center;box-shadow:0 18px 45px rgba(15,23,42,.1)}.logo{width:54px;height:54px;margin:0 auto 18px;border-radius:13px;background:#df2428;color:#fff;display:grid;place-items:center;font-weight:900}h1{font-size:22px;margin:0 0 10px}p{color:#64748b;line-height:1.5;margin:0}.bar{height:6px;background:#fee2e2;border-radius:20px;overflow:hidden;margin:24px 0 12px}.bar:before{content:'';display:block;width:45%;height:100%;background:#df2428;border-radius:20px;animation:go 1s infinite alternate}@keyframes go{to{transform:translateX(125%)}}#status{font-size:13px;font-weight:600;color:#df2428}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">D7</div>
    <h1>Recuperando o D7COMERCIAL</h1>
    <p>Removendo a versão antiga e carregando o sistema corrigido.</p>
    <div class="bar"></div>
    <div id="status">Limpando arquivos antigos…</div>
  </main>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
        localStorage.removeItem('d7_last_tab');
        document.getElementById('status').textContent='Sistema recuperado. Abrindo…';
        location.replace('./index.html?recovered='+Date.now());
      }catch(error){
        document.getElementById('status').textContent='Atualize esta página para concluir.';
      }
    })();
  </script>
</body>
</html>

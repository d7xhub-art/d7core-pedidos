<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migrar dados — D7COMERCIAL</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(680px,100%);background:#171717;border:1px solid #2b2b2b;border-radius:16px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:25px}p{color:#aaa;line-height:1.5}.brand{color:#ef4444;font-weight:900;letter-spacing:1px}.box{background:#101010;border:1px solid #2b2b2b;border-radius:12px;padding:16px;margin:18px 0}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.n{background:#1f1f1f;border-radius:10px;padding:12px;text-align:center}.n b{display:block;font-size:22px}.n span{font-size:11px;color:#888}.btn{width:100%;border:0;border-radius:10px;padding:13px 16px;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}.primary{background:#dc2626;color:#fff}.secondary{background:#262626;color:#eee;border:1px solid #383838}.ok{color:#4ade80}.warn{color:#fbbf24}.err{color:#f87171}input[type=file]{display:none}@media(max-width:560px){.counts{grid-template-columns:1fr 1fr}.card{padding:20px}}</style></head><body><div class="card"><div class="brand">D7COMERCIAL</div><h1>Migração segura de dados</h1><p>Importe o backup do D7 antigo. Os registros atuais não são apagados; cadastros com o mesmo identificador são mesclados.</p><div class="box"><b>Dados neste navegador</b><div class="counts" id="localCounts"></div></div><input id="file" type="file" accept="application/json,.json"><button class="btn primary" onclick="document.getElementById('file').click()">Selecionar D7_BACKUP_DADOS_ANTIGOS.json</button><button class="btn secondary" onclick="location.href='./'">Voltar ao D7COMERCIAL</button><p id="status"></p></div><script>
const KEYS=['clientes','produtos','representadas','pedidos','followups','prospectos','orcamentos'];
const get=k=>{try{return JSON.parse(localStorage.getItem('d7_'+k)||'[]')}catch{return []}};
const keyOf=x=>String((x&&((x.id??x.num)??x.cod))??'');
function merge(a,b){a=Array.isArray(a)?a:[];b=Array.isArray(b)?b:[];const out=[...a],pos=new Map();out.forEach((x,i)=>{const k=keyOf(x);if(k)pos.set(k,i)});for(const x of b){const k=keyOf(x);if(k&&pos.has(k))out[pos.get(k)]={...out[pos.get(k)],...x};else{out.push(x);if(k)pos.set(k,out.length-1)}}return out}
function parseBackup(data,k){let v=data[k];if(v===undefined)v=data['d7_'+k];if(typeof v==='string'){try{v=JSON.parse(v)}catch{return []}}return Array.isArray(v)?v:[]}
function render(){const lab={clientes:'Clientes',produtos:'Produtos',representadas:'Representadas',pedidos:'Pedidos'};document.getElementById('localCounts').innerHTML=['clientes','produtos','representadas','pedidos'].map(k=>`<div class="n"><b>${get(k).length}</b><span>${lab[k]}</span></div>`).join('')}render();
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const st=document.getElementById('status');st.className='warn';st.textContent='Validando e importando...';try{const data=JSON.parse(await f.text());if(!data||typeof data!=='object')throw Error('arquivo inválido');let imported=0;for(const k of KEYS){const rows=parseBackup(data,k);if(rows.length){localStorage.setItem('d7_'+k,JSON.stringify(merge(get(k),rows)));imported+=rows.length}}if(!imported)throw Error('nenhum cadastro reconhecido');localStorage.setItem('d7_migracao_em',new Date().toISOString());render();st.className='ok';st.textContent=`Migração concluída: ${imported} registros processados. Abrindo o D7COMERCIAL...`;setTimeout(()=>location.href='./?migracao='+Date.now(),1300)}catch(err){st.className='err';st.textContent='Não consegui importar: '+err.message}});
</script></body></html>

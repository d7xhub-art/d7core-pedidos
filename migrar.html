<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migrar dados — D7COMERCIAL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(680px,100%);background:#171717;border:1px solid #2b2b2b;border-radius:16px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:25px}p{color:#aaa;line-height:1.5}.brand{color:#ef4444;font-weight:900;letter-spacing:1px}.box{background:#101010;border:1px solid #2b2b2b;border-radius:12px;padding:16px;margin:18px 0}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.n{background:#1f1f1f;border-radius:10px;padding:12px;text-align:center}.n b{display:block;font-size:22px;color:#fff}.n span{font-size:11px;color:#888}.btn{width:100%;border:0;border-radius:10px;padding:13px 16px;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}.primary{background:#dc2626;color:#fff}.secondary{background:#262626;color:#eee;border:1px solid #383838}.ok{color:#4ade80}.warn{color:#fbbf24}.err{color:#f87171}input[type=file]{display:none}@media(max-width:560px){.counts{grid-template-columns:1fr 1fr}.card{padding:20px}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">D7COMERCIAL</div>
  <h1>Migração segura de dados</h1>
  <p>Esta página recupera o backup do D7 antigo sem apagar registros que já existam neste navegador. Depois da importação, o D7COMERCIAL abre e sincroniza os dados com a nuvem.</p>

  <div class="box">
    <b>Dados encontrados neste navegador</b>
    <div class="counts" id="localCounts"></div>
  </div>

  <input id="file" type="file" accept="application/json,.json">
  <button class="btn primary" onclick="document.getElementById('file').click()">Selecionar backup do D7 antigo</button>
  <button class="btn secondary" onclick="location.href='./'">Voltar ao D7COMERCIAL</button>
  <p id="status"></p>
</div>
<script>
const KEYS=['clientes','produtos','representadas','pedidos','followups','prospectos','orcamentos'];
const get=k=>{try{return JSON.parse(localStorage.getItem('d7_'+k)||'[]')}catch{return []}};
const keyOf=x=>String((x&&((x.id??x.num)??x.cod))??'');
function merge(oldRows,newRows){
  if(!Array.isArray(oldRows))oldRows=[];if(!Array.isArray(newRows))newRows=[];
  const out=[...oldRows], pos=new Map();out.forEach((x,i)=>{const k=keyOf(x);if(k)pos.set(k,i)});
  for(const x of newRows){const k=keyOf(x);if(k&&pos.has(k)){out[pos.get(k)]={...out[pos.get(k)],...x}}else{out.push(x);if(k)pos.set(k,out.length-1)}}
  return out;
}
function renderCounts(){
  const labels={clientes:'Clientes',produtos:'Produtos',representadas:'Representadas',pedidos:'Pedidos'};
  document.getElementById('localCounts').innerHTML=['clientes','produtos','representadas','pedidos'].map(k=>`<div class="n"><b>${get(k).length}</b><span>${labels[k]}</span></div>`).join('');
}
renderCounts();
document.getElementById('file').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const st=document.getElementById('status');st.className='warn';st.textContent='Lendo e validando o backup...';
  try{
    const data=JSON.parse(await f.text());
    if(!data||typeof data!=='object')throw new Error('arquivo inválido');
    let imported=0;
    for(const k of KEYS){
      if(Array.isArray(data[k])){const merged=merge(get(k),data[k]);localStorage.setItem('d7_'+k,JSON.stringify(merged));imported+=data[k].length;}
    }
    if(!imported)throw new Error('nenhum cadastro reconhecido no backup');
    localStorage.setItem('d7_migracao_em',new Date().toISOString());
    renderCounts();
    st.className='ok';st.textContent='Migração concluída. Abrindo o D7COMERCIAL para sincronizar com a nuvem...';
    setTimeout(()=>location.href='./?migracao='+Date.now(),1100);
  }catch(err){st.className='err';st.textContent='Não consegui importar este arquivo: '+err.message;}
});
</script>
</body>
</html>

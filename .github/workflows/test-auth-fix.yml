name: Testar ajuste de autenticação
on:
  push:
    branches: [fix/login-magic-link-mensagem]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-magic-link-mensagem
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.mjs
      - run: node --check auth-guard.js

name: Aplicar e Validar Novo Pedido

on:
  push:
    branches: [feat/novo-pedido-profissional]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novo-pedido-profissional
      - name: Confirmar teste RED
        run: |
          if node tests/smoke.mjs; then
            echo "FALHA_TDD: teste deveria falhar antes da implementação"
            exit 1
          else
            echo "RED_OK"
          fi
      - name: Aplicar patch
        run: |
          sed -i "s/re.subn(pattern,novo,s/re.subn(pattern,lambda m: novo,s/" tools/apply_novo_pedido.py
          python tools/apply_novo_pedido.py
      - name: Rodar testes GREEN
        run: |
          node tests/smoke.mjs
          node --check auth-guard.js
          node --check sync-guard.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['pedido-profissional','Resumo do Pedido','Preço não cadastrado','preco-indisponivel','pedido-dados-compactos',"if(!(Number(p.preco)>0))"]:
              assert x in s, x
          print('NOVO_PEDIDO_PRO_OK')
          PY
      - name: Commit da implementação
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: profissionalizar tela de novo pedido"
          git push origin HEAD:feat/novo-pedido-profissional

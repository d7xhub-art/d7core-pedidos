name: Validar interface publicada

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de teste
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Validar D7 PEDIDOS publicado
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            for(let attempt=0;attempt<20;attempt++){
              await page.goto('https://d7xhub-art.github.io/d7core-pedidos/?check='+Date.now(),{waitUntil:'networkidle',timeout:90000});
              if(await page.locator('#si-historico').count())break;
              await page.waitForTimeout(15000);
            }
            await page.waitForTimeout(2500);
            const title=await page.title();
            const body=await page.locator('body').innerText();
            if(!title.includes('D7 PEDIDOS')) throw new Error('Título inesperado: '+title);
            for(const t of ['Clientes','Produtos','Representadas','Pedidos','Histórico']){
              if(!body.includes(t)) throw new Error('Item ausente: '+t);
            }
            for(const bad of ['w.document.close();','setTimeout(()=>w.print()','${prods.length}','function imprimirCatalogo()']){
              if(body.includes(bad)) throw new Error('Código exposto na interface: '+bad);
            }
            if(errors.length) throw new Error('Erros JavaScript na página: '+errors.join(' | '));
            console.log('RENDER_OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Validar login somente por e-mail
        run: node tests/email-login.cjs
      - name: Testar emissão, edição, impressão e WhatsApp
        run: node tests/order-lifecycle.cjs
      - name: Validar visual real do Novo Pedido
        run: node tests/visual-novo-pedido.cjs
      - name: Validar envio real do catálogo ao WhatsApp
        run: node tests/catalogo-whatsapp.cjs
      - name: Salvar captura validada
        uses: actions/upload-artifact@v4
        with:
          name: novo-pedido-validado
          path: artifacts/novo-pedido-validado.png

name: Aplicar correção segura de inicialização

on:
  push:
    branches: [fix/finalizacao-segura-d7comercial]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[safe-startup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch mínimo e seguro
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start='// On startup: pull cloud first, then push any local data that exists\n'
          end='\nfunction pgConfig(){'
          if start not in s:
              raise SystemExit('Bloco legado de startup não encontrado')
          a=s.index(start)
          b=s.index(end,a)
          s=s[:a]+s[b:]
          needle='</script>\n</body>'
          repl='</script>\n<script src="./sync-guard.js?v=2.3-safe"></script>\n</body>'
          if needle not in s:
              raise SystemExit('Ponto de inserção do guard não encontrado')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar patch antes do commit
        run: node tests/smoke.mjs
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: proteger primeira sincronização [safe-startup-applied]'
          git push
